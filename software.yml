# Elk programma = één blok.
#
# Bron voor het versienummer (kies er één):
#   github: eigenaar/repo
#   url + regex     regex met precies één groep voor het versienummer; staan er meerdere versies
#                   op de pagina, dan is de hoogste de huidige en de één-na-hoogste de vorige versie
#   json + key      versie uit een JSON-bestand
#   replace         tekens in de gevonden versie vervangen, bijvoorbeeld ["_", "."]
#   previous_from_page: false   vorige versie niet uit de pagina halen (alleen zelf bijhouden)
#   version         zelf invullen (bijvoorbeeld als de download achter een login zit)
#
# Optioneel:
#   icon            optioneel: pad of link naar een afbeelding, bijvoorbeeld icons/qlab.png (bestand in docs/icons/); zonder icon komt er een lettericoon
#   icon_text       optioneel: eigen letters voor het lettericoon
#   favorite        true: komt ook onder FAVORITES (bovenaan de zijbalk) en krijgt een sterretje
#   category        een van de categorieën hierboven; zonder category staat het programma alleen onder ALL
#   link            waar de downloadknop heen gaat (standaard: url)
#   downloads       meerdere knoppen, bijvoorbeeld Mac en Windows
#   notes_url       link naar de release notes ({version} en {version_dash} worden ingevuld)
#   notes_label     tekst van die link
#   date_regex      regex met één groep: de release-datum, gezocht op date_url (standaard: url)
#   notes_regex     regex met één groep: het HTML-stuk met de wijzigingen, gezocht op notes_page (standaard: url)
#   vendor          fabrikant; programma's met dezelfde vendor delen één icoontje boven de zoekbalk
#   strip           false = niet tonen in de icoontjesrij boven de zoekbalk (plugins staan er nooit in)
#   website         pagina van de fabrikant waar de naam naartoe linkt (standaard: de hoofdpagina van de site uit url/link)
#   released        release-datum zelf invullen, bijvoorbeeld "2026-10-09" (bij handmatige versies)
#
interval_hours: 6

# Categorieën in de zijbalk, in deze volgorde. 'ALL' staat er altijd boven.
# Ze komen op een programma met  category: NAAM  (hoofdletters maken niet uit).
categories: [SYSTEM DESIGN & TUNING, NETWORK, MIXING & I/O, PLAYBACK & RECORDING, WIRELESS & COMMS, PLUGINS]

# Knop "Mis je iets?" op de pagina. Laat 'endpoint' leeg en er verschijnt geen formulier.
contact:
  endpoint: ""      # bijvoorbeeld https://api.web3forms.com/submit
  access_key: ""    # de sleutel die web3forms.com je per e-mail stuurt (mag openbaar in de pagina staan)
  email: ""         # alleen als 'endpoint' leeg is: de knop opent dan het mailprogramma, maar je adres staat dan open en bloot in de pagina

