name: Check software updates
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths: ["software.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python checker.py
      - name: Resultaat opslaan
        run: |
          git config user.name "update-watcher"
          git config user.email "update-watcher@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "Update versies"
            git push
          fi
